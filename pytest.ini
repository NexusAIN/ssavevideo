[pytest]
# `tests/` only, so a stray scratch file is never collected.
testpaths = tests
addopts = --strict-markers --disable-warnings
# Integration modules hit the real extractor against a localhost fixture server;
# they are the slowest part of the suite (~4s) and the only ones that need a socket.
markers =
    slow: exercises the real yt-dlp engine over loopback HTTP
filterwarnings =
    ignore::DeprecationWarning
